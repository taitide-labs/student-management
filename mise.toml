#:schema https://mise.jdx.dev/schema/mise.json

[tools]
hk = "2.12"
rumdl = "0.3.3"
lychee = "0.24.2"
typos = "1"
gitleaks = "8"
zizmor = "1"
"github:huacnlee/autocorrect" = "2.16.3"
"github:1jehuang/mermaid-rs-renderer" = "0.3.1"
cargo-deny = "0.20.2"
ast-grep = "0.51.3"
sccache = "0.19.0"
"github:nextest-rs/nextest" = "cargo-nextest-0.9.152"

[tasks.fmt]
description = "Auto-fix documentation formatting, typography, and code formatting"
run = "hk fix --all --silent -n"

[tasks.lock]
description = "Update Cargo.lock for workspace dependency changes"
run = "cargo generate-lockfile"

[tasks.client]
description = "Run headless client tests"
run = "nsh test clients/app"

[tasks.check]
description = "Run all documentation, formatting, ast-grep, clippy, test, dependency audit, and client checks"
run = ["hk check --all --silent -n", "cargo deny check", "nsh test clients/app"]

[tasks.app]
description = "Run macOS desktop client"
run = "nsh run clients/app"

[tasks.tui]
description = "Run TUI client in current terminal"
run = "nsh run clients/app --target tui"

[tasks.mobile]
description = "Run mobile shell via Mac Catalyst (requires Xcode and rustup target aarch64-apple-ios-macabi)"
run = "nsh run clients/app --target catalyst"

[tasks.web]
description = "Run Web client in browser"
run = 'PATH="/opt/homebrew/opt/llvm/bin:/usr/local/opt/llvm/bin:$PATH" nsh run clients/app --target web'

[tasks.sms]
description = "Run sms CLI client (pass args after --)"
run = "cargo run --quiet --bin sms --"

[tasks.api]
description = "Run backend HTTP API server"
run = "cargo run --quiet -p student-management-api"

[tasks.openapi]
description = "Export OpenAPI schema to contracts/openapi.json"
run = "cargo run --quiet -p student-management-api -- --export-openapi contracts/openapi.json"
