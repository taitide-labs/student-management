[package]
name = "student-management-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
mock = []
remote = ["dep:ureq"]
nsh = ["dep:nsh-core"]
local = ["dep:student-management-runtime", "dep:tokio"]

[dependencies]
nsh-core = { workspace = true, optional = true }
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
student-management-contracts = { path = "../../backend/contracts" }
student-management-runtime = { path = "../../backend/runtime", optional = true }
thiserror.workspace = true
tokio = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
