[workspace]
resolver = "3"
members = [
  "backend/primitives",
  "backend/contracts",
  "backend/infra",
  "backend/contexts/identity/domain",
  "backend/contexts/identity/features",
  "backend/contexts/enrollment/domain",
  "backend/contexts/enrollment/features",
  "backend/contexts/grading/domain",
  "backend/contexts/grading/features",
  "backend/runtime",
  "backend/api",
  "clients/gateway",
  "clients/cli",
  "clients/app",
  "e2e",
]

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "MIT"
repository = "https://github.com/taitide-labs/student-management"

[workspace.dependencies]
argon2 = "0.6"
axum = "0.8"
clap = { version = "4.6", features = ["env"] }
inventory = "0.3"
jiff = "1.0"
nsh-base = "0.6.1"
nsh-core = "0.6.1"
nsh-platform-linux = { version = "0.6.1", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "websocket", "updater", "svg", "net", "sound"] }
nsh-platform-macos = { version = "0.6.1", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "websocket", "updater", "svg"] }
nsh-platform-windows = { version = "0.6.1", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "websocket", "updater", "svg", "net"] }
nsh-engine = { version = "0.6.1", default-features = false }
nsh-testing = { version = "0.6.1", default-features = false }
parking_lot = "0.13"
proptest = "1.12"
rstest = "0.28"
rust_decimal = { version = "1.43", features = ["serde-with-str"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace"] }
ureq = { version = "3.5", default-features = false, features = ["json"] }
utoipa = { version = "6.0", features = ["axum_extras", "decimal"] }
uuid = { version = "1.29", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
let_underscore_drop = "deny"

[workspace.lints.clippy]
allow_attributes = "forbid"
allow_attributes_without_reason = "forbid"

unwrap_used = "forbid"
todo = "forbid"
unimplemented = "forbid"
dbg_macro = "forbid"
let_underscore_must_use = "forbid"
let_underscore_future = "forbid"
panic_in_result_fn = "forbid"
fallible_impl_from = "forbid"

await_holding_lock = "forbid"
await_holding_refcell_ref = "forbid"

expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
wildcard_enum_match_arm = "deny"
large_futures = "deny"
print_stdout = "deny"
print_stderr = "deny"

disallowed_types = "deny"
disallowed_methods = "deny"
disallowed_macros = "deny"
disallowed_fields = "deny"
disallowed_names = "deny"

cognitive_complexity = "deny"
too_many_lines = "deny"
needless_pass_by_value = "deny"
cloned_instead_of_copied = "deny"
clone_on_ref_ptr = "deny"
mod_module_files = "forbid"
tests_outside_test_module = "forbid"
inline_modules = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
