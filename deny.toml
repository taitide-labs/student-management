[graph]
all-features = true

[output]
feature-depth = 1

[advisories]
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained; pulled in transitively by nsh-core and nsh-base with no upstream replacement yet" },
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz is unmaintained; pulled in transitively by usvg/resvg via nsh-core" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained; pulled in transitively by nsh-core, nsh-macros, and usvg" },
]

[licenses]
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
