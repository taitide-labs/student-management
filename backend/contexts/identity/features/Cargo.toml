[package]
name = "student-management-identity-features"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
http = [
  "dep:axum",
  "dep:student-management-contracts",
  "dep:student-management-infra",
  "dep:utoipa",
  "student-management-contracts?/openapi",
  "student-management-infra/http",
]

[[test]]
name = "acceptance"
path = "tests/acceptance.rs"
required-features = ["http"]

[dependencies]
axum = { workspace = true, optional = true }
inventory.workspace = true
student-management-contracts = { path = "../../../contracts", optional = true }
student-management-infra = { path = "../../../infra", optional = true }
utoipa = { workspace = true, optional = true }

[dev-dependencies]
rstest.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
tower.workspace = true
